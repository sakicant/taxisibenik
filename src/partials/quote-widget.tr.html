      <div class="quote-widget" id="quote-widget">
        <div class="quote-trip-toggle">
          <button type="button" class="trip-toggle-btn active" data-trip="oneway">Tek yön</button>
          <button type="button" class="trip-toggle-btn" data-trip="return">Gidiş &amp; dönüş</button>
        </div>

        <div class="quote-field">
          <label for="quote-from-input">Nereden</label>
          <div class="combo" data-placeholder="Alınacak yer">
            <input type="text" class="combo-input" id="quote-from-input" placeholder="Alınacak yer" autocomplete="off" role="combobox" aria-expanded="false" aria-autocomplete="list">
            <input type="hidden" id="quote-from">
            <div class="combo-panel" hidden></div>
          </div>
        </div>
        <div class="quote-field">
          <label for="quote-to-input">Nereye</label>
          <div class="combo" data-placeholder="Varış yeri">
            <input type="text" class="combo-input" id="quote-to-input" placeholder="Varış yeri" autocomplete="off" role="combobox" aria-expanded="false" aria-autocomplete="list">
            <input type="hidden" id="quote-to">
            <div class="combo-panel" hidden></div>
          </div>
        </div>

        <div class="quote-field-row">
          <div class="quote-stepper">
            <label>Yolcu</label>
            <div class="stepper-control">
              <button type="button" class="stepper-btn" data-target="quote-passengers" data-delta="-1" aria-label="Yolcu sayısını azalt">&minus;</button>
              <span id="quote-passengers" data-value="1" data-min="1" data-max="12">1</span>
              <button type="button" class="stepper-btn" data-target="quote-passengers" data-delta="1" aria-label="Yolcu sayısını artır">+</button>
            </div>
          </div>
          <div class="quote-stepper">
            <label>Bagaj</label>
            <div class="stepper-control">
              <button type="button" class="stepper-btn" data-target="quote-luggage" data-delta="-1" aria-label="Bagaj sayısını azalt">&minus;</button>
              <span id="quote-luggage" data-value="1" data-min="0" data-max="6">1</span>
              <button type="button" class="stepper-btn" data-target="quote-luggage" data-delta="1" aria-label="Bagaj sayısını artır">+</button>
            </div>
          </div>
        </div>

        <button type="button" id="quote-submit" class="btn btn-primary quote-btn">Sabit fiyatı gör</button>

        <div id="quote-result" class="quote-result" hidden></div>
      </div>
