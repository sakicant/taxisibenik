      <div class="quote-widget" id="quote-widget">
        <div class="quote-trip-toggle">
          <button type="button" class="trip-toggle-btn active" data-trip="oneway">Еднопосочно</button>
          <button type="button" class="trip-toggle-btn" data-trip="return">Отиване &amp; връщане</button>
        </div>

        <div class="quote-field">
          <label for="quote-from-input">От</label>
          <div class="combo" data-placeholder="Място на вземане">
            <input type="text" class="combo-input" id="quote-from-input" placeholder="Място на вземане" autocomplete="off" role="combobox" aria-expanded="false" aria-autocomplete="list">
            <input type="hidden" id="quote-from">
            <div class="combo-panel" hidden></div>
          </div>
        </div>
        <div class="quote-field">
          <label for="quote-to-input">До</label>
          <div class="combo" data-placeholder="Дестинация">
            <input type="text" class="combo-input" id="quote-to-input" placeholder="Дестинация" autocomplete="off" role="combobox" aria-expanded="false" aria-autocomplete="list">
            <input type="hidden" id="quote-to">
            <div class="combo-panel" hidden></div>
          </div>
        </div>

        <div class="quote-field-row">
          <div class="quote-stepper">
            <label>Пътници</label>
            <div class="stepper-control">
              <button type="button" class="stepper-btn" data-target="quote-passengers" data-delta="-1" aria-label="Намаляване на пътниците">&minus;</button>
              <span id="quote-passengers" data-value="1" data-min="1" data-max="12">1</span>
              <button type="button" class="stepper-btn" data-target="quote-passengers" data-delta="1" aria-label="Увеличаване на пътниците">+</button>
            </div>
          </div>
          <div class="quote-stepper">
            <label>Багаж</label>
            <div class="stepper-control">
              <button type="button" class="stepper-btn" data-target="quote-luggage" data-delta="-1" aria-label="Намаляване на багажа">&minus;</button>
              <span id="quote-luggage" data-value="1" data-min="0" data-max="6">1</span>
              <button type="button" class="stepper-btn" data-target="quote-luggage" data-delta="1" aria-label="Увеличаване на багажа">+</button>
            </div>
          </div>
        </div>

        <button type="button" id="quote-submit" class="btn btn-primary quote-btn">Вижте фиксираната цена</button>

        <div id="quote-result" class="quote-result" hidden></div>
      </div>
