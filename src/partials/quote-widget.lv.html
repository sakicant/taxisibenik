      <div class="quote-widget" id="quote-widget">
        <div class="quote-trip-toggle">
          <button type="button" class="trip-toggle-btn active" data-trip="oneway">Vienā virzienā</button>
          <button type="button" class="trip-toggle-btn" data-trip="return">Turp &amp; atpakaļ</button>
        </div>

        <div class="quote-field">
          <label for="quote-from-input">No</label>
          <div class="combo" data-placeholder="Uzņemšanas vieta">
            <input type="text" class="combo-input" id="quote-from-input" placeholder="Uzņemšanas vieta" autocomplete="off" role="combobox" aria-expanded="false" aria-autocomplete="list">
            <input type="hidden" id="quote-from">
            <div class="combo-panel" hidden></div>
          </div>
        </div>
        <div class="quote-field">
          <label for="quote-to-input">Uz</label>
          <div class="combo" data-placeholder="Galamērķis">
            <input type="text" class="combo-input" id="quote-to-input" placeholder="Galamērķis" autocomplete="off" role="combobox" aria-expanded="false" aria-autocomplete="list">
            <input type="hidden" id="quote-to">
            <div class="combo-panel" hidden></div>
          </div>
        </div>

        <div class="quote-field-row">
          <div class="quote-stepper">
            <label>Pasažieri</label>
            <div class="stepper-control">
              <button type="button" class="stepper-btn" data-target="quote-passengers" data-delta="-1" aria-label="Samazināt pasažieru skaitu">&minus;</button>
              <span id="quote-passengers" data-value="1" data-min="1" data-max="12">1</span>
              <button type="button" class="stepper-btn" data-target="quote-passengers" data-delta="1" aria-label="Palielināt pasažieru skaitu">+</button>
            </div>
          </div>
          <div class="quote-stepper">
            <label>Bagāža</label>
            <div class="stepper-control">
              <button type="button" class="stepper-btn" data-target="quote-luggage" data-delta="-1" aria-label="Samazināt bagāžas daudzumu">&minus;</button>
              <span id="quote-luggage" data-value="1" data-min="0" data-max="6">1</span>
              <button type="button" class="stepper-btn" data-target="quote-luggage" data-delta="1" aria-label="Palielināt bagāžas daudzumu">+</button>
            </div>
          </div>
        </div>

        <button type="button" id="quote-submit" class="btn btn-primary quote-btn">Skatīt fiksēto cenu</button>

        <div id="quote-result" class="quote-result" hidden></div>
      </div>
