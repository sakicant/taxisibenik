      <div class="quote-widget" id="quote-widget">
        <div class="quote-trip-toggle">
          <button type="button" class="trip-toggle-btn active" data-trip="oneway">Doar dus</button>
          <button type="button" class="trip-toggle-btn" data-trip="return">Dus &amp; întors</button>
        </div>

        <div class="quote-field">
          <label for="quote-from-input">De la</label>
          <div class="combo" data-placeholder="Loc de preluare">
            <input type="text" class="combo-input" id="quote-from-input" placeholder="Loc de preluare" autocomplete="off" role="combobox" aria-expanded="false" aria-autocomplete="list">
            <input type="hidden" id="quote-from">
            <div class="combo-panel" hidden></div>
          </div>
        </div>
        <div class="quote-field">
          <label for="quote-to-input">Către</label>
          <div class="combo" data-placeholder="Destinație">
            <input type="text" class="combo-input" id="quote-to-input" placeholder="Destinație" autocomplete="off" role="combobox" aria-expanded="false" aria-autocomplete="list">
            <input type="hidden" id="quote-to">
            <div class="combo-panel" hidden></div>
          </div>
        </div>

        <div class="quote-field-row">
          <div class="quote-stepper">
            <label>Pasageri</label>
            <div class="stepper-control">
              <button type="button" class="stepper-btn" data-target="quote-passengers" data-delta="-1" aria-label="Scade numărul de pasageri">&minus;</button>
              <span id="quote-passengers" data-value="1" data-min="1" data-max="12">1</span>
              <button type="button" class="stepper-btn" data-target="quote-passengers" data-delta="1" aria-label="Crește numărul de pasageri">+</button>
            </div>
          </div>
          <div class="quote-stepper">
            <label>Bagaje</label>
            <div class="stepper-control">
              <button type="button" class="stepper-btn" data-target="quote-luggage" data-delta="-1" aria-label="Scade numărul de bagaje">&minus;</button>
              <span id="quote-luggage" data-value="1" data-min="0" data-max="6">1</span>
              <button type="button" class="stepper-btn" data-target="quote-luggage" data-delta="1" aria-label="Crește numărul de bagaje">+</button>
            </div>
          </div>
        </div>

        <button type="button" id="quote-submit" class="btn btn-primary quote-btn">Vedeți prețul fix</button>

        <div id="quote-result" class="quote-result" hidden></div>
      </div>
